name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile sources
        run: python -m compileall -q codex_local_mcp tests scripts server.py
      - name: Offline unit and IPC tests
        run: python -m unittest discover -v
      - name: Official MCP client dependency
        run: python -m pip install mcp==1.26.0
      - name: Official MCP client compatibility
        run: python scripts/sdk_check.py
      - name: Package install smoke test
        run: |
          python -m pip install .
          codex-local-mcp --version
      - name: Build source ZIP
        run: python scripts/build_source_zip.py
      - name: Verify source ZIP
        run: python scripts/build_source_zip.py --verify
