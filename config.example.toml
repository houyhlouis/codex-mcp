# Optional Codex MCP settings. Normal use needs no settings file.
# Use it with:  python3 server.py --config /absolute/path/config.toml serve
# Keep this file outside every project folder you give to Codex, and make it
# private (chmod 600 on macOS/Linux). Paths may start with ~; environment
# variables such as $HOME or %USERPROFILE% are not expanded.
# See docs/configuration.md for details.

# Private broker state (database, log, socket). Defaults:
#   macOS/Linux: ~/.local/state/codex-mcp   Windows: %LOCALAPPDATA%\CodexMCP
# state_dir = "/absolute/private/state/codex-mcp"

# Codex executable. A bare name is looked up on PATH only.
codex_binary = "codex"

# Independent task families that may run at the same time (1-32).
max_tasks = 4

# Extra read-only paths for the sandbox (for example an unusual toolchain).
toolchain_paths = []

# true lets the main agent APPROVE requests on your behalf. Not needed for
# "Approve for me" (Codex's automatic reviewer). Keep false unless you trust it.
approval_relay = false

# true lets Codex tasks use external MCP servers/plugins from your Codex setup.
# They run outside the project sandbox.
allow_external_tools = false
