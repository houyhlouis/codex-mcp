# Optional server settings. No configuration file is needed for normal use.
# The main agent creates/selects work directories through MCP tools.
# Keep a real settings file outside any directory given to a coding task.
# Paths support a leading ~, but do not expand shell environment variables.
# Defaults: %LOCALAPPDATA%/CodexMCP on Windows; ~/.local/state/codex-mcp on Unix.
# state_dir = "/absolute/private/state/codex-mcp"
codex_binary = "codex"
max_tasks = 4

# Optional, operator-reviewed READ-ONLY runtime/dependency paths.
# System runtimes and the exact Codex executable are already readable.
toolchain_paths = []

# Default: positive approvals require MCP human elicitation or terminal review.
# Enable only if you explicitly trust the main agent to relay your decisions.
approval_relay = false

# External MCP servers/plugins can act outside filesystem sandbox boundaries.
# Disabled for bridge threads by default. Existing Codex configuration is not edited.
allow_external_tools = false

